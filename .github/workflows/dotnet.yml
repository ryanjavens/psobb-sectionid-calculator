name: .NET

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        rid: [ linux-x64, win-x64, osx-arm64 ]

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish ${{ matrix.rid }}
      run: dotnet publish SectionIdCalculator.csproj -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}
    - name: Zip executable
      run: |
        cd publish/${{ matrix.rid }}
        zip -r "${GITHUB_WORKSPACE}/SectionIdCalculator-${{ matrix.rid }}.zip" .
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: SectionIdCalculator-${{ matrix.rid }}.zip
